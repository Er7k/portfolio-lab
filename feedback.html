<!DOCTYPE html>
<html lang="en">
  <head>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Feedback | Erik Sjöberg Portfolio</title>

    <meta name="description" content="Send feedback about Erik Sjöberg's portfolio." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <script src="feedback.js" defer></script>

  </head>

  <body id="top">
    <header class="site-header">
      <nav class="nav container" aria-label="Main navigation">
        <a href="index.html#top" class="profile-name">Erik Sjöberg</a>
        <div class="nav-links">
          <a href="index.html#top">About</a>
          <a href="index.html#interests">Interests</a>
          <a href="index.html#projects">Projects</a>
          <a href="gallery.html">Gallery</a>
          <a href="feedback.html" aria-current="page">Feedback</a>
          <a href="index.html#contact">Contact</a>
        </div>
      </nav>
    </header>

    <main class="feedback-page container">

      <h1>Share your feedback</h1>

      <form class="contact-form feedback-form">

        <label for="full-name">
          Full name
          <input id="full-name" type="text" name="name" autocomplete="name" aria-describedby="full-name-error" required />
          <span id="full-name-error" class="field-error" aria-live="polite" hidden></span>
        </label>

        <label for="email">
          Email
          <input id="email" type="email" name="email" autocomplete="email" required />
        </label>

        <label for="topic">
          Topic of interest
          <select id="topic" name="topic" required>
            <option value="" selected disabled>Select a topic</option>
            <option value="design">Design and layout</option>
            <option value="content">Content and writing</option>
            <option value="projects">Projects</option>
            <option value="accessibility">Accessibility</option>
            <option value="other">Other</option>
          </select>
        </label>

        <label for="comments">
          Comments
          <textarea id="comments" name="comments" rows="6" required></textarea>
        </label>

        <label for="website">
          Website URL (optional)
          <input id="website" type="url" name="website" placeholder="https://example.com" />
        </label>

        <div class="feedback-actions">
          <button id="send-feedback" type="button" class="button">Send feedback</button>
          <button id="clear-feedback" type="reset" class="button">Clear</button>
        </div>

      </form>

    </main>

    <footer class="site-footer">

      <div class="container footer-bottom">
        <p>© 2026 Erik Sjöberg</p>
        <div class="footer-links">
          <a href="mailto:ejkan_98@hotmail.com">ejkan_98@hotmail.com</a>
        </div>
      </div>

    </footer>

  </body>

</html>
